name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # WHY: Prisma generation validates URL shape but does not connect during this CI job.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate schema and regenerate the typed Prisma client
        run: npm run prisma:validate && npm run prisma:generate
      - name: Lint, test, type-check, and build all projects
        run: npx nx run-many -t lint,test,typecheck,build
      - name: Check production dependency advisories
        run: npm audit --omit=dev --omit=optional --audit-level=high

  container-builds:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v6
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t learning-api:${{ github.sha }} .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t learning-web:${{ github.sha }} .
